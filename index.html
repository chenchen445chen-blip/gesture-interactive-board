<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手势交互画板 - Gesture Interactive Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" class="app-container" data-mode="draw">

      <!-- ① 固定视口：overflow:hidden，PS 风格深色背景 -->
      <div class="canvas-viewport" id="canvas-viewport">
        <!-- 可变换画布容器（平移 + 缩放） -->
        <div id="canvas-inner" class="canvas-inner">
          <canvas id="drawing-canvas"></canvas>
        </div>
      </div>

      <!-- ② 骨骼与 3D 手模叠加层：固定在屏幕，不受视图变换影响 -->
      <canvas id="landmark-canvas" class="landmark-canvas"></canvas>
      <canvas id="hand-3d-canvas" class="hand-3d-canvas"></canvas>

      <!-- 虚拟手势光标 -->
      <div id="virtual-cursor" class="virtual-cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-ring"></div>
        <div class="cursor-label" id="cursor-label">食指指引</div>
      </div>

      <!-- 顶部浮动工具栏 -->
      <header class="toolbar-header">
        <div class="toolbar-card">
          <div class="brand-section">
            <span class="brand-icon">✨</span>
            <span class="brand-title">Gesture Canvas</span>
          </div>

          <div class="divider"></div>

          <!-- 交互模式切换 -->
          <div class="mode-group" id="mode-group">
            <button class="mode-btn active" data-mode="draw" id="mode-draw" title="画笔模式：捏合下笔，手掌张开橡皮擦">
              <span class="mode-icon">✏️</span>
              <div class="mode-meta">
                <span class="mode-name">画笔</span>
                <span class="mode-desc">捏合作画</span>
              </div>
            </button>
            <button class="mode-btn" data-mode="canvas" id="mode-canvas" title="画布控制：手掌平移，捏合缩放，握拳复位">
              <span class="mode-icon">🖼️</span>
              <div class="mode-meta">
                <span class="mode-name">画布</span>
                <span class="mode-desc">手掌平移</span>
              </div>
            </button>
            <button class="mode-btn" data-mode="select" id="mode-select" title="指针模式：食指移动，捏合选中">
              <span class="mode-icon">🖱️</span>
              <div class="mode-meta">
                <span class="mode-name">指针</span>
                <span class="mode-desc">悬停选中</span>
              </div>
            </button>
          </div>

          <!-- 模式徽标 -->
          <div class="mode-badge" id="mode-badge">
            <span class="mode-badge-pinch" id="badge-pinch">🤏 捏合→作画</span>
            <span class="mode-badge-sep">·</span>
            <span class="mode-badge-palm" id="badge-palm">🖐️ 手掌→橡皮擦</span>
          </div>

          <div class="divider"></div>

          <!-- 画笔子工具 -->
          <div class="tools-group draw-only" id="draw-tools">
            <button class="tool-btn active" data-tool="brush" title="画笔">
              <span class="icon">🖌️</span>
              <span class="label">画笔</span>
            </button>
            <button class="tool-btn" data-tool="eraser" title="橡皮擦">
              <span class="icon">🧹</span>
              <span class="label">橡皮</span>
            </button>
          </div>

          <!-- 颜色 -->
          <div class="color-palette draw-only" id="color-palette">
            <button class="color-btn active" style="--color: #3b82f6" data-color="#3b82f6"></button>
            <button class="color-btn" style="--color: #ef4444" data-color="#ef4444"></button>
            <button class="color-btn" style="--color: #10b981" data-color="#10b981"></button>
            <button class="color-btn" style="--color: #f59e0b" data-color="#f59e0b"></button>
            <button class="color-btn" style="--color: #8b5cf6" data-color="#8b5cf6"></button>
            <button class="color-btn" style="--color: #000000" data-color="#000000"></button>
          </div>

          <!-- 粗细 -->
          <div class="size-slider-wrapper draw-only">
            <label for="brush-size" class="slider-label">粗细</label>
            <input type="range" id="brush-size" min="2" max="40" value="6" />
            <span id="brush-size-display" class="size-val">6px</span>
          </div>

          <div class="divider"></div>

          <!-- 操作按钮 -->
          <div class="actions-group">
            <button id="btn-undo" class="action-btn" title="撤销 (Ctrl+Z)">↩️</button>
            <button id="btn-clear" class="action-btn danger" title="清空画布">🗑️</button>
            <button id="btn-reset-view" class="action-btn" title="重置视图 (0)">⊡</button>
            <button id="btn-toggle-camera" class="action-btn" title="摄像头预览">📷</button>
            <div class="hand-mode-picker" id="hand-mode-picker">
              <button id="btn-toggle-skeleton" class="action-btn active" title="手部模型显示 (右侧小箭头切换风格)">
                <span class="btn-icon">🖐️</span>
                <span class="picker-caret" id="btn-open-hand-styles">▾</span>
              </button>
              <div class="hand-style-dropdown hidden" id="hand-style-dropdown">
                <div class="dropdown-header">3D 手势呈现风格</div>
                <button class="style-item active" data-style="skin">
                  <span class="style-icon">🖐️</span>
                  <div class="style-info">
                    <span class="style-title">3D 拟真手模</span>
                    <span class="style-desc">PBR 皮肤质感与立体指节 (推荐)</span>
                  </div>
                </button>
                <button class="style-item" data-style="model">
                  <span class="style-icon">🤖</span>
                  <div class="style-info">
                    <span class="style-title">开源标准手模</span>
                    <span class="style-desc">WebXR 标准 3D 骨骼模型</span>
                  </div>
                </button>
                <button class="style-item" data-style="cyber">
                  <span class="style-icon">⚡</span>
                  <div class="style-info">
                    <span class="style-title">赛博机甲手</span>
                    <span class="style-desc">钛金拉丝与科技脉冲关节</span>
                  </div>
                </button>
                <button class="style-item" data-style="skeleton">
                  <span class="style-icon">🦴</span>
                  <div class="style-info">
                    <span class="style-title">2D 线框骨骼</span>
                    <span class="style-desc">经典极简线条模式</span>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- 实时 HUD -->
      <aside class="stats-hud">
        <div class="hud-item">
          <span class="hud-label">FPS</span>
          <span id="hud-fps" class="hud-val">—</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">模式</span>
          <span id="hud-mode" class="hud-val hud-mode-val">画笔</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">缩放</span>
          <span id="zoom-indicator" class="hud-val">100%</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">手势</span>
          <span id="hud-gesture" class="hud-val highlight">—</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">状态</span>
          <span id="hud-status" class="hud-val">摄像头未启动</span>
        </div>
      </aside>

      <!-- Toast 提示 -->
      <div id="action-toast" class="action-toast hidden">
        <span class="toast-icon">✨</span>
        <span id="toast-text" class="toast-text">手势动作触发</span>
      </div>

      <!-- 手势操作指南 -->
      <aside class="gesture-guide-card" id="gesture-guide-card">
        <div class="guide-header">
          <span class="guide-title" id="guide-title">📖 画笔模式手势</span>
          <button id="btn-close-guide" class="guide-close" title="收起指南">×</button>
        </div>
        <ul class="guide-list" id="guide-list">
          <li><strong>🤏 捏合</strong>：下笔作画</li>
          <li><strong>☝️ 单食指伸出</strong>：悬停移动光标</li>
          <li><strong>🖐️ 手掌张开 (手心朝前)</strong>：橡皮擦</li>
          <li><strong>🤚 手背朝前</strong>：防误触悬停</li>
          <li><strong>✊ 握拳</strong>：暂停</li>
        </ul>
      </aside>

      <!-- 摄像头画中画 -->
      <div id="video-container" class="video-preview-wrapper hidden">
        <video id="webcam-video" playsinline autoplay muted></video>
        <canvas id="pip-canvas" class="pip-canvas"></canvas>
        <span class="video-badge">摄像头输入 (镜像)</span>
      </div>

      <!-- 右下角悬浮摄像头启动按钮 -->
      <div id="camera-fab" class="camera-fab" title="开启手势识别摄像头">
        <div class="fab-ring"></div>
        <span class="fab-icon">📷</span>
        <div class="fab-label">
          <span class="fab-title" id="fab-title">开启手势</span>
          <span class="fab-sub" id="fab-sub">点击启动摄像头</span>
        </div>
        <div class="fab-loading hidden" id="fab-loading">
          <div class="fab-spinner"></div>
          <span id="fab-loading-msg">初始化中...</span>
        </div>
      </div>

      <!-- 快捷键提示（右上角小标） -->
      <div class="shortcut-hint">
        滚轮缩放 · 中键平移 · 0 复位 · ±缩放
      </div>

    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
